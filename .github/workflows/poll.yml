name: Poll ComEd

# Every 10 minutes: fetch a snapshot, rebuild the dashboard, publish to Pages.
#
# Snapshot history lives on an orphan `data` branch that is force-pushed as a
# single commit each run. Committing to main instead would grow the repository
# forever — 144 commits a day, each carrying a full outage list — and nothing
# here benefits from that history being replayable.
#
# GitHub delays scheduled workflows under load, so the gaps between snapshots
# are irregular. That is fine: every rate the tool reports is computed from the
# span actually measured, and windows finer than the real interval are flagged.

# DISABLED. Automated polling is switched off deliberately.
#
# Repeated probing from CI — thirteen runs, ~20 requests each including
# multi-megabyte bundle downloads, minutes apart from cloud IPs — got
# www.comed.com to return 403 to this runner. That is a site telling us our
# traffic pattern is unwelcome, and the correct response is to stop, not to
# disguise the requests.
#
# Re-enable the schedule only once there is a known, appropriate endpoint and a
# polling interval that respects it. The map itself refreshes every 120s, so
# nothing here ever needed to be more aggressive than that.
on:
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore snapshot history
        run: |
          if git fetch origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- data/ || echo "data branch has no snapshots yet"
          else
            echo "No data branch yet — this is the first run."
          fi

      - name: Poll the outage map
        # Escape hatch if ComEd redeploys and auto-discovery stops finding the
        # GUIDs: set these as repository variables and the poll uses them
        # directly. Empty is the normal case and means "discover them".
        env:
          COMED_INSTANCE_ID: ${{ vars.COMED_INSTANCE_ID }}
          COMED_VIEW_ID: ${{ vars.COMED_VIEW_ID }}
        run: node comed.js poll --keep-hours 72

      - name: Build the dashboard
        run: node comed.js html --out _site/index.html

      - name: Publish the JSON feed alongside it
        run: node comed.js report --json > _site/data.json

      - name: Save snapshot history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . > /dev/null
          git add -f data/
          git commit -q -m "Snapshots as of $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-tmp:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement:true turns Pages on via the API on the first run, so there is
      # no manual Settings step. If the token lacks permission this fails loudly
      # rather than silently deploying nowhere — set Settings -> Pages -> Source
      # to "GitHub Actions" by hand and re-run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
